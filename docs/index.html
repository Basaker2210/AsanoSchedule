<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Asano Schedule Pro</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5}
.app{display:flex;height:100vh}.sidebar{width:280px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:20px;overflow-y:auto}
.logo{font-size:24px;font-weight:bold;margin-bottom:30px;text-align:center}
.nav{list-style:none}.nav li{padding:12px 16px;margin-bottom:8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px}

.stats{display:flex;gap:20px}.stat{text-align:center}.stat-val{font-size:24px;font-weight:bold;color:#667eea}.stat-lab{font-size:12px;color:#999;margin-top:4px}
.content{flex:1;overflow-y:auto;padding:20px 30px}.view{display:none}.view.active{display:block}
.task-list{list-style:none}.task-item{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:4px solid #667eea}

.task-title{font-size:16px;font-weight:500;color:#333}.task-item.done .task-title{text-decoration:line-through;color:#999}
.task-desc{font-size:13px;color:#666;margin-top:4px}.task-meta{display:flex;gap:12px;margin-top:8px;font-size:12px;flex-wrap:wrap}

.acts{display:flex;gap:8px;flex-shrink:0}.btn-icon{width:32px;height:32px;border:none;border-radius:6px;background:#f0f0f0;cursor:pointer;font-size:16px}
.btn-icon:hover{background:#e0e0e0}.btn-icon.del:hover{background:#ffebee;color:#c62828}
.empty{text-align:center;padding:60px 20px;color:#999}.empty-ico{font-size:60px;margin-bottom:15px}.empty-txt{font-size:18px;color:#333}
.fab{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;color:#fff;font-size:32px;cursor:pointer;box-shadow:0 5px 20px rgba(102,126,234,.4)}
.fab:hover{transform:scale(1.1)}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center}
.modal.show{display:flex}.modal-box{background:#fff;border-radius:15px;padding:30px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:22px;font-weight:700;margin-bottom:20px;color:#333}
.form-group{margin-bottom:16px}.form-label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:#333}
.inp,.sel,.ta{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.ta{resize:vertical;min-height:80px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-btns{display:flex;gap:12px;margin-top:24px}.btn{flex:1;padding:12px 16px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}.btn-secondary{background:#f0f0f0;color:#333}
.cal-container{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.cal-nav{display:flex;gap:12px}.cal-nav button{padding:8px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.cal-day{aspect-ratio:1;border:1px solid #e0e0e0;border-radius:8px;padding:8px;background:#fff;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.cal-day.today{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-weight:bold}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px}
.stat-card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat-card-title{font-size:14px;color:#999;margin-bottom:12px}.stat-card-val{font-size:36px;font-weight:700;color:#667eea;margin-bottom:8px}.stat-card-pct{font-size:12px;color:#4CAF50}
.chart-box{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:20px}.chart-title{font-size:16px;font-weight:600;margin-bottom:15px;color:#333}
@media(max-width:768px){.app{flex-direction:column}.sidebar{width:100%;height:60px;overflow-x:auto}.logo{display:none}.nav{display:flex;gap:8px}.nav li{margin-bottom:0;white-space:nowrap}.form-row{grid-template-columns:1fr}}
